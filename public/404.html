<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... | CalcWealth</title>
  <script>
    // Single Page App redirect for static hosts (GitHub Pages, etc.)
    // This script redirects 404s to index.html while preserving the path
    (function() {
      var pathSegmentsToKeep = 0; // Set to 1 if hosted in a subdirectory
      var location = window.location;
      
      // Store the current path in sessionStorage
      sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
      
      // Redirect to the root
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/'
      );
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0B1120 0%, #1E293B 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94A3B8;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/">
  </noscript>
  <div class="container">
    <div class="spinner"></div>
    <h1>Redirecting...</h1>
    <p>Please wait while we load the page.</p>
  </div>
</body>
</html>
